<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseBoost</title>
    <!-- Polices à embarquer localement en prod (pas de CDN dans un .exe offline) -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Filtre "liquid glass" (distorsion) référencé par les boutons premium -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <filter id="liquid-glass" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="1" seed="1" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blur" />
        <feDisplacementMap in="SourceGraphic" in2="blur" scale="60" xChannelSelector="R" yChannelSelector="B" />
      </filter>
    </defs></svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
